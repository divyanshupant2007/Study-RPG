<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Study RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- App Container -->
  <div class="app-container">
    
    <!-- Views -->
    <div id="view-dashboard" class="view active">
      <header class="top-bar">
        <h1>Study RPG</h1>
        <div class="streak-badge" id="streak-badge">
          <strong>Day-<span id="streak-count">00</span></strong> 🔥
        </div>
      </header>
      
      <!-- Character Card -->
      <div class="glass-card character-card">
        <div class="avatar-glow">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=study" alt="Avatar" class="avatar">
        </div>
        <div class="char-info">
          <h2 id="char-title">Ledger Novice</h2>
          <p>Level <span id="char-level">1</span></p>
        </div>
        <div class="xp-bar-container">
          <div class="xp-bar" id="char-xp-bar" style="width: 0%"></div>
        </div>
        <p class="xp-text"><span id="char-xp">0</span> / <span id="char-xp-req">50</span> XP</p>
      </div>

      <!-- Quick Stats / Radar Chart -->
      <div class="glass-card chart-card">
        <h3>Skill Mastery</h3>
        <canvas id="radar-chart"></canvas>
      </div>

      <!-- Subject Summary -->
      <div class="subjects-summary" id="dashboard-subjects">
        <!-- Injected via JS -->
      </div>
    </div>

    <div id="view-subjects" class="view">
      <header class="top-bar">
        <h1>Skill Trees</h1>
      </header>
      <div class="subjects-list" id="full-subjects-list">
        <!-- Injected via JS -->
      </div>
    </div>

    <div id="view-inventory" class="view">
      <header class="top-bar">
        <h1>Loot & Badges</h1>
      </header>
      <div class="inventory-grid" id="inventory-grid">
        <!-- Injected via JS -->
      </div>
    </div>

    <div id="view-bosses" class="view">
      <header class="top-bar">
        <h1>Boss Battles</h1>
      </header>
      <div class="boss-list" id="boss-list">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-target="view-dashboard">
        <i data-lucide="home"></i>
        <span>Home</span>
      </button>
      <button class="nav-item" data-target="view-subjects">
        <i data-lucide="book-open"></i>
        <span>Skills</span>
      </button>
      <!-- Floating Action Button for Logging Session -->
      <button class="fab" id="fab-log-session">
        <i data-lucide="plus"></i>
      </button>
      <button class="nav-item" data-target="view-inventory">
        <i data-lucide="backpack"></i>
        <span>Loot</span>
      </button>
      <button class="nav-item" data-target="view-bosses">
        <i data-lucide="swords"></i>
        <span>Bosses</span>
      </button>
    </nav>
  </div>

  <!-- Log Session Modal -->
  <div class="modal-overlay" id="log-modal">
    <div class="glass-modal">
      <button class="close-modal" id="close-log-modal"><i data-lucide="x"></i></button>
      <h2>Log Session</h2>
      <form id="log-session-form">
        <div class="form-group">
          <label for="subject-select">Subject</label>
          <select id="subject-select" required>
            <!-- Injected via JS -->
          </select>
        </div>
        <div class="form-group">
          <label for="duration-input">Duration (Minutes)</label>
          <input type="number" id="duration-input" min="1" max="600" required>
        </div>
        <div class="form-group">
          <label>Focus Rating (Optional)</label>
          <div class="star-rating">
            <i data-lucide="star" data-rating="1"></i>
            <i data-lucide="star" data-rating="2"></i>
            <i data-lucide="star" data-rating="3"></i>
            <i data-lucide="star" data-rating="4"></i>
            <i data-lucide="star" data-rating="5"></i>
          </div>
          <input type="hidden" id="focus-input" value="0">
        </div>
        <button type="submit" class="btn-primary">Complete Session</button>
      </form>
    </div>
  </div>

  <!-- Loot Drop Overlay -->
  <div class="modal-overlay loot-drop" id="loot-drop-overlay">
    <div class="glass-modal loot-reveal">
      <h2>Loot Drop!</h2>
      <div class="loot-icon-container">
        <i data-lucide="gift" id="loot-drop-icon"></i>
      </div>
      <h3 id="loot-drop-name">Golden Calculator</h3>
      <p id="loot-drop-desc">A charm for quick math</p>
      <button class="btn-primary" id="collect-loot-btn">Collect</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
